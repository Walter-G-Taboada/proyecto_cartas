<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Baum Cartas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-2xl border border-yellow-600 w-96">
        <h1 class="text-2xl font-bold text-yellow-500 mb-6 text-center">BAUM <span class="text-white text-lg">Cartas 2026</span></h1>
        
        <form action="/login" method="POST" class="space-y-4">
    <div>
        <label class="block text-sm mb-1 text-gray-400">Usuario</label>
        <input type="text" name="username" required 
               class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:border-yellow-500 outline-none"
               placeholder="Wally...">
    </div>

    <div>
        <label class="block text-sm mb-1 text-gray-400">Contraseña</label>
        <input type="password" name="password" required 
               class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white focus:border-yellow-500 outline-none"
               placeholder="••••••••">
    </div>

    <button type="submit" class="w-full bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 rounded transition shadow-lg mt-2">
        Entrar
    </button>
</form>
    </div>
</body>
</html>
