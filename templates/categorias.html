{% extends "layout.html" %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h2 class="text-2xl font-bold text-yellow-500 mb-6 uppercase tracking-wider">
        🗂️ Gestión de Categorías Comerciales
    </h2>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-5 bg-gray-800 p-6 rounded-lg border border-gray-700 h-fit shadow-xl">
            <h3 class="text-white font-semibold mb-4 text-sm uppercase text-gray-300">Nueva Categoría</h3>
            <form action="{{ url_for('categorias.dashboard_categorias') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nombre de la Categoría</label>
                    <input type="text" name="nombre_categoria" required placeholder="Ej: Regulares"
                           class="w-full p-2 bg-gray-700 border border-gray-600 rounded text-white text-sm outline-none focus:border-yellow-500 font-bold">
                </div>
                <button type="submit" class="w-full bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded text-sm transition shadow">
                    ➕ Crear Categoría
                </button>
            </form>
        </div>

        <div class="lg:col-span-7 bg-gray-800 border border-gray-700 rounded-lg overflow-hidden shadow-xl">
            <table class="w-full text-left table-fixed">
                <thead class="bg-gray-700 text-yellow-500 text-xs uppercase tracking-wider">
                    <tr>
                        <th class="p-3 w-3/4">Nombre de Categoría</th>
                        <th class="p-3 w-1/4 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700 text-sm text-gray-300">
                    {% if categorias %}
                        {% for cat in categorias %}
                        <tr class="hover:bg-gray-750 transition">
                            
                            <td class="p-3 font-semibold text-white">
                                {{ cat.nombre_categoria }}
                            </td>
                            
                            <td class="p-3 text-center">
                                <div class="flex items-center justify-center gap-4">
                                    <a href="{{ url_for('categorias.editar_categoria', id_cat=cat.id_categoria) }}" title="Editar" class="text-green-500 hover:text-green-400 font-bold text-lg">
                                        📝
                                    </a>

                                    <form action="{{ url_for('categorias.eliminar_categoria', id_cat=cat.id_categoria) }}" method="POST" 
                                          onsubmit="return confirm('¿Seguro que querés eliminar esta categoría?');" class="inline m-0 p-0">
                                        <button type="submit" title="Eliminar" class="text-red-500 hover:text-red-400 font-bold text-lg cursor-pointer">
                                            🗑️
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    {% else %}
                        <tr>
                            <td colspan="2" class="p-8 text-center text-gray-500 italic">
                                No hay categorías creadas todavía.
                            </td>
                        </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
