{% extends "layout.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-8">Seleccionar Local</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {% for local in locales %}
    <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 hover:border-yellow-500 transition shadow-lg">
        <h3 class="text-yellow-500 font-bold text-xl">{{ local.codigo_local }}</h3>
        <p class="text-white">{{ local.nombre_local }}</p>
        
        <div class="mt-4">
            <a href="/local/{{ local.codigo_local }}" class="text-sm bg-yellow-600 text-black px-3 py-1 rounded font-bold hover:bg-yellow-500">
                Ver Precios
            </a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
