{% extends "layout.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-yellow-500">Editar Rubro</h2>
        <p class="text-gray-400 text-sm">Modifique el nombre de la categoría.</p>
    </div>

    <div class="bg-gray-800 p-8 rounded-lg border border-gray-700 shadow-2xl">
        <form action="/actualizar_rubro" method="POST" class="space-y-6">
            <input type="hidden" name="id_rubro" value="{{ rubro.id_rubro }}">

            <div>
                <label class="block text-sm text-gray-400 mb-2">Nombre del Rubro</label>
                <input type="text" name="nombre_rubro" value="{{ rubro.nombre_rubro }}" required 
                       class="w-full p-3 bg-gray-700 border border-gray-600 rounded text-white focus:border-yellow-500 outline-none transition">
            </div>

            <div class="flex justify-between items-center pt-4">
                <a href="/rubros" class="text-gray-400 hover:text-white transition">Cancelar</a>
                <button type="submit" class="bg-yellow-600 hover:bg-yellow-500 text-black px-8 py-2 rounded font-bold transition shadow-lg">
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
